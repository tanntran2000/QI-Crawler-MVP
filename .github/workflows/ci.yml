name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

  tests-ubuntu-312:
    name: Tests Ubuntu 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux Qt runtime dependencies
        shell: bash
        run: |
          set -euo pipefail

          has_qt_runtime() {
            local cache
            cache="$(ldconfig -p)"
            [[ "$cache" == *"libEGL.so.1"* ]] && [[ "$cache" == *"libGL.so.1"* ]]
          }

          apt_with_cap() {
            if ! timeout --foreground 180s sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              "$@"; then
              echo "ERROR: Linux Qt provisioning failed or exceeded its 180-second cap: apt-get $*" >&2
              exit 1
            fi
          }

          if has_qt_runtime; then
            echo "Linux Qt runtime libraries already available; skipping apt-get."
            exit 0
          fi

          apt_with_cap update
          apt_with_cap install --yes --no-install-recommends libegl1 libgl1

          if ! has_qt_runtime; then
            echo "ERROR: libEGL.so.1 and libGL.so.1 are required for PySide6 offscreen tests." >&2
            exit 1
          fi

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: Full regression
        run: python -m pytest -q

  tests-windows-312:
    name: Tests Windows 3.12
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: Full regression
        env:
          PYTHONPATH: ${{ github.workspace }}\scripts
          PYTEST_ADDOPTS: -p ci_windows_runtime_attribution
        run: python -m pytest -q

  compatibility-ubuntu-311:
    name: Compatibility Ubuntu 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linux Qt runtime dependencies
        shell: bash
        run: |
          set -euo pipefail

          has_qt_runtime() {
            local cache
            cache="$(ldconfig -p)"
            [[ "$cache" == *"libEGL.so.1"* ]] && [[ "$cache" == *"libGL.so.1"* ]]
          }

          apt_with_cap() {
            if ! timeout --foreground 180s sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              "$@"; then
              echo "ERROR: Linux Qt provisioning failed or exceeded its 180-second cap: apt-get $*" >&2
              exit 1
            fi
          }

          if has_qt_runtime; then
            echo "Linux Qt runtime libraries already available; skipping apt-get."
            exit 0
          fi

          apt_with_cap update
          apt_with_cap install --yes --no-install-recommends libegl1 libgl1

          if ! has_qt_runtime; then
            echo "ERROR: libEGL.so.1 and libGL.so.1 are required for PySide6 offscreen tests." >&2
            exit 1
          fi

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: Compatibility regression
        run: python -m pytest -q
