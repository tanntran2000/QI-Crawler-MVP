name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

  tests-ubuntu-312:
    name: Tests Ubuntu 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux Qt runtime dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update

          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install --yes --no-install-recommends \
            libegl1 \
            libgl1

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: Full regression
        run: python -m pytest -q

  tests-windows-312:
    name: Tests Windows 3.12
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: Full regression
        run: python -m pytest -q -n 2

  compatibility-ubuntu-311:
    name: Compatibility Ubuntu 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linux Qt runtime dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update

          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install --yes --no-install-recommends \
            libegl1 \
            libgl1

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: Compatibility regression
        run: python -m pytest -q
