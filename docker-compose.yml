services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: egp
      POSTGRES_USER: egp
      POSTGRES_PASSWORD: egp
    ports:
      - "5432:5432"
    volumes:
      - egp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egp -d egp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  egp_pgdata:
