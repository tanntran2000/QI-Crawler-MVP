[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "QI-Crawler"
version = "0.4.0"
description = "Compliant async crawler and ETL toolkit for public e-procurement data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "duckdb>=1.3,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "playwright>=1.49,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "typer>=0.13,<1",
  "uvicorn[standard]>=0.32,<1"
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[project.scripts]
QI-Crawler = "qi_crawler.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/qi_crawler/cli.py" = ["B008"]  # Typer declares CLI metadata in defaults by design.
